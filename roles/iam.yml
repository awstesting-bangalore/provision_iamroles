# These roles are deployed to respective accounts being processed.
# AWS Managed Policies will be auto-discovered from policies/aws_managed_policies/{roleName}/ folder.
# Customer Managed policies will be auto-discovered from policies/customer_managed_policies/{roleName}/ folder.
# Trust relationships will be auto-discovered from the respective Role folder under trust_relationships/{roleName}/ and attached to the role.

